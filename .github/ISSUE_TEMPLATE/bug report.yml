name: 🐞 Bug report
description: Report a bug in the Invictus product.
type: Bug
projects: ["invictus-integration/6"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your contribution to the Invictus product.

        > [!WARNING]
        > This issue is public. Don't include secrets, connection strings, access tokens, or customer/tenant-identifying data in your description, logs, or screenshots.
  - type: checkboxes
    id: existing-issue-check
    attributes:
      label: Is there an existing issue for this?
      options:
        - label: I searched existing issues and didn't find a duplicate.
          required: true
  - type: dropdown
    id: invictus-version
    attributes:
      label: Version
      description: In which version of the product did this bug occur? This dropdown mirrors the versions in the release notes.
      options:
        - Other / not sure
        - "6.4.x"
        - "6.3.x"
        - "6.2.x"
        - "6.1.x"
        - "6.0.x"
      default: 0
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: Ex. I expected the flow search to return results from all folders.
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: A clear and concise description of what actually happened.
      placeholder: Ex. The flow search only returned results from the root folder.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the incorrect behavior.
      placeholder: |
        1. Open the Dashboard search page.
        2. Filter flows by a custom property.
        3. Notice the search returns no results.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Copy and paste any relevant log output or stack trace. This is automatically formatted as code, so no need for backticks.
      render: shell
  - type: upload
    id: screenshots
    attributes:
      label: Screenshots
      description: Attach any screenshots that help illustrate the bug.
  - type: textarea
    id: context
    attributes:
      label: Context
      placeholder: Add the link to the pages or any other context related to the bug report here.
