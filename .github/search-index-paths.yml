# Single source of truth for "does this change affect the search bar
# results?" — referenced by both verify-search-index.yml (pull_request) and
# publish-search-index.yml (push/workflow_dispatch) via dorny/paths-filter, so
# the path list only needs to be maintained in one place.
search-index:
  - 'versioned_docs/**/*.md'
  - 'versioned_docs/**/*.mdx'
  - 'versioned_sidebars/**/*.json'
  - 'versions.json'
  - 'src/data/framework.v6.bicep.parameters.json'
  - 'src/data/dashboard.v6.bicep.parameters.json'
  - 'scripts/refresh-search-index.ps1'
