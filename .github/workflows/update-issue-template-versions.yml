name: Update issue template version dropdowns

on:
  push:
    branches:
      - main
    paths:
      - 'versioned_docs/**/support/release-notes.mdx'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dropdowns:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the latest commit
        uses: actions/checkout@v4

      - name: Regenerate Version dropdowns from release notes
        shell: pwsh
        run: scripts/update-issue-template-versions.ps1

      - name: Open a pull request with the updated dropdowns
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore(gh): update issue template version dropdowns from release notes'
          branch: update-issue-template-versions
          delete-branch: true
          title: 'chore(gh): update issue template version dropdowns'
          body: |
            The `Version` dropdown in the bug report and feature request issue
            templates was regenerated from the `<ReleaseVersion>` entries in
            the release notes.

            This PR was opened automatically by the
            [Update issue template version dropdowns](../actions/workflows/update-issue-template-versions.yml) workflow.
