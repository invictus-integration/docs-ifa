name: Verify search index is up to date

# PR-time half of keeping the Azure AI Search index (and its static,
# offline-search fallback, src/data/search-index.json) in sync with anything
# that can show up in search-bar results. See publish-search-index.yml for the
# post-merge half. The set of paths that matter to search is defined once in
# search-index-paths.yml and shared between both workflows via
# dorny/paths-filter, since GitHub's own trigger-level `paths:` filter can't
# be shared across separate workflow files.
# See scripts/refresh-search-index.ps1 and CONTRIBUTING.md#keeping-search-up-to-date.

on:
  pull_request:
    branches: [master, main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      search-index: ${{ steps.filter.outputs.search-index }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/search-index-paths.yml

  verify-index-is-committed:
    # Regenerate knowledge.json / src/data/search-index.json locally (no
    # Azure access, no secrets needed) and fail if the result doesn't match
    # what's committed — catches "changed a doc but forgot to regenerate and
    # commit the search index" before it merges.
    needs: detect-changes
    if: needs.detect-changes.outputs.search-index == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate the local search index
        shell: pwsh
        run: ./scripts/refresh-search-index.ps1 -LocalOnly

      - name: Fail if knowledge.json / search-index.json are out of date
        run: |
          if ! git diff --quiet -- knowledge.json src/data/search-index.json; then
            echo "::error::knowledge.json and/or src/data/search-index.json are out of date for this change."
            echo "::error::Run 'pwsh scripts/refresh-search-index.ps1 -LocalOnly' locally, review the diff, and commit the result."
            git --no-pager diff --stat -- knowledge.json src/data/search-index.json
            exit 1
          fi
