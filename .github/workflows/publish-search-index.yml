name: Publish search index

# Post-merge half of keeping the Azure AI Search index (and its static,
# offline-search fallback, src/data/search-index.json) in sync with anything
# that can show up in search-bar results. See verify-search-index.yml for the
# PR-time half. The set of paths that matter to search is defined once in
# search-index-paths.yml and shared between both workflows via
# dorny/paths-filter, since GitHub's own trigger-level `paths:` filter can't
# be shared across separate workflow files.
# See scripts/refresh-search-index.ps1 and CONTRIBUTING.md#keeping-search-up-to-date.

on:
  push:
    branches: [master, main]
  workflow_dispatch: {}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # A manual run should always publish, regardless of what last changed.
      search-index: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.search-index }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'push'
        with:
          filters: .github/search-index-paths.yml

  publish-index:
    # Push the regenerated documents straight to the production Azure AI
    # Search index, so search results reflect what's now live.
    # mergeOrUpload-only (see the script) — this step only ever adds/updates
    # documents, never deletes; orphan cleanup (-PruneOrphans) stays a manual,
    # interactive step run locally by a maintainer.
    needs: detect-changes
    if: needs.detect-changes.outputs.search-index == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-search-index
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Push documents to Azure AI Search
        shell: pwsh
        env:
          AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}
          AZURE_SEARCH_INDEX: ${{ secrets.AZURE_SEARCH_INDEX }}
          AZURE_SEARCH_ADMIN_KEY: ${{ secrets.AZURE_SEARCH_ADMIN_KEY }}
        run: ./scripts/refresh-search-index.ps1
