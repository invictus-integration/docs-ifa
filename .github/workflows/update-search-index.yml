name: Update search index

# Keeps the Azure AI Search index (and its static, offline-search fallback,
# src/data/search-index.json) in sync with anything that can show up in
# search-bar results: doc content, sidebar placement (drives the
# business/technical user_type tagging), the supported-versions list, and
# the Bicep parameter data files that get indexed alongside their doc page.
# See scripts/refresh-search-index.ps1 and CONTRIBUTING.md#keeping-search-up-to-date.

on:
  pull_request:
    branches: [master, main]
    paths:
      - 'versioned_docs/**/*.md'
      - 'versioned_docs/**/*.mdx'
      - 'versioned_sidebars/**/*.json'
      - 'versions.json'
      - 'src/data/framework.v6.bicep.parameters.json'
      - 'src/data/dashboard.v6.bicep.parameters.json'
      - 'scripts/refresh-search-index.ps1'
  push:
    branches: [master, main]
    paths:
      - 'versioned_docs/**/*.md'
      - 'versioned_docs/**/*.mdx'
      - 'versioned_sidebars/**/*.json'
      - 'versions.json'
      - 'src/data/framework.v6.bicep.parameters.json'
      - 'src/data/dashboard.v6.bicep.parameters.json'
      - 'scripts/refresh-search-index.ps1'
  workflow_dispatch: {}

jobs:
  verify-index-is-committed:
    # PRs: regenerate knowledge.json / src/data/search-index.json locally (no
    # Azure access, no secrets needed) and fail if the result doesn't match
    # what's committed — catches "changed a doc but forgot to regenerate and
    # commit the search index" before it merges.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate the local search index
        shell: pwsh
        run: ./scripts/refresh-search-index.ps1 -LocalOnly

      - name: Fail if knowledge.json / search-index.json are out of date
        run: |
          if ! git diff --quiet -- knowledge.json src/data/search-index.json; then
            echo "::error::knowledge.json and/or src/data/search-index.json are out of date for this change."
            echo "::error::Run 'pwsh scripts/refresh-search-index.ps1 -LocalOnly' locally, review the diff, and commit the result."
            git --no-pager diff --stat -- knowledge.json src/data/search-index.json
            exit 1
          fi

  publish-index:
    # master/main: push the regenerated documents straight to the production
    # Azure AI Search index, so search results reflect what's now live.
    # mergeOrUpload-only (see the script) — this step only ever adds/updates
    # documents, never deletes; orphan cleanup (-PruneOrphans) stays a manual,
    # interactive step run locally by a maintainer.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-search-index
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Push documents to Azure AI Search
        shell: pwsh
        env:
          AZURE_SEARCH_ENDPOINT: ${{ secrets.AZURE_SEARCH_ENDPOINT }}
          AZURE_SEARCH_INDEX: ${{ secrets.AZURE_SEARCH_INDEX }}
          AZURE_SEARCH_ADMIN_KEY: ${{ secrets.AZURE_SEARCH_ADMIN_KEY }}
        run: ./scripts/refresh-search-index.ps1
